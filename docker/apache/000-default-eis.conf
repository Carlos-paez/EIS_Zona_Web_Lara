# ============================================================
# Apache vhost para el contenedor EIS System
# ============================================================
<VirtualHost *:80>
    ServerName localhost

    # La aplicación vive en src/
    DocumentRoot /var/www/html/src

    <Directory /var/www/html/src>
        Options -Indexes +FollowSymLinks
        # Las reglas de rewrire están aquí (per-server), no en .htaccess del repo
        AllowOverride None
        Require all granted
    </Directory>

    # URLs limpias: ?pagina=X  ->  /index.php?pagina=X
    RewriteEngine On

    # Raiz del sitio
    RewriteRule ^/?$ /index.php [L,QSA]

    # Páginas dinámicas (solo si el archivo/directorio no existe fisicamente)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^/?([\w-]+)/?$ /index.php?pagina=$1 [L,QSA]
</VirtualHost>